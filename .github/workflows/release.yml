name: Release

# Pushing a tag like v5.1.0 runs the tests and, if they pass, creates a DRAFT
# GitHub release with the notes from CHANGELOG.md. Servers only see a release
# once someone presses "Publish release" on GitHub.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag matches the VERSION file
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Install restic and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends restic
          pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build the Docker image
        run: docker build -t statement-software-release-check .
      - name: Take the release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = open("VERSION").read().strip()
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no notes for {version}")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          PY
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Statement Software $(cat VERSION)" --notes-file release-notes.md
