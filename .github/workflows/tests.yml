name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install restic (used by the cloud backup tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends restic
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
