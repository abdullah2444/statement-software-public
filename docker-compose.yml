services:
  statement-software-v4:
    build:
      context: .
      dockerfile: Dockerfile.cached
    image: statement-software:v4.0
    container_name: statement-software-v4
    hostname: statement-software-v4
    ports:
      - "18451:18451"
    volumes:
      - ../statement-software-v4-data/firefly_statement.db:/data/firefly_statement.db
      - ../statement-software-v4-data/uploads:/data/uploads
      - ../statement-software-v4-data/backups:/data/backups
    environment:
      PORT: "18451"
      HOST: "0.0.0.0"
      FLASK_DEBUG: "0"
      DATABASE_PATH: /data/firefly_statement.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-512}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-0}"
      SOURCE_CSV_PATH: "${SOURCE_CSV_PATH:-}"
      SECRET_KEY: "${SECRET_KEY}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      RESET_SECRET_TOKEN: "${RESET_SECRET_TOKEN:-}"
    restart: unless-stopped
